  body { background: #fff; color: #000; font-size: 11pt; }
  .topbar, .indice, .fab, .seg-foot, .pager, .lab-tabs, .tl-filters, .lentes, .site-foot, .btn, .timer { display: none !important; }
  .seg { break-inside: auto; }
  .mito .rev[hidden] { display: grid !important; }
}

  /* ---------- Entrene un perceptrón ---------- */
  W.perceptron = function (el) {

    function reiniciar() { w = new Array(N).fill(0); b = 0; intentos = 0; hist = []; actual = null; }
    function nuevaTarjeta() {
      var lado = Math.random() < 0.5 ? -1 : 1;

      var col = lado < 0 ? Math.floor(Math.random() * 3) : 3 + Math.floor(Math.random() * 3);

<script>
/* Widgets del Taller 2: duplicar, DRAM, paquetes, gráfico de Moore, ELIZA,

(function () {
  'use strict';

  /* ---------- Duplicar cada dos años ---------- */
  W.duplicar = function (el) {
    var anios = 20, periodo = 2;
    var big = h('div', { class: 'w-big' });

    var b2 = h('button', { class: 'chip', type: 'button' }, 'Cada dos años (ajuste de 1975)');

      var veces = Math.floor(anios / periodo);

  /* ---------- DRAM: baldes con agujerito ---------- */

  /* ---------- Red de paquetes: «login» ---------- */

      });

      function frame(now) {
        if (!vivo(el)) return;
        var t = now - t0, activos = 0;
        paquetes.forEach(function (pq) {
          if (pq.listo) return;
          var f = (t - pq.inicio) / pq.dur;
          if (caido || f < 0) { pq.g.setAttribute('opacity', caido ? 0 : 0); if (!caido) activos++; return; }

  /* ---------- ELIZA en español ---------- */
  W.eliza = function (el) {

      [/\bme siento (.+)/i, ['¿Por qué se siente $1?', '¿Desde cuándo se siente $1?']],

      [/\bporque (.+)/i, ['¿Es esa la verdadera razón?', '¿Qué otras razones se le ocurren?']],
      [/^(sí|si)\b/i, ['Parece muy seguro.', 'Entiendo.']],
      [/^no\b/i, ['¿Por qué no?', '¿Está seguro?']],

    el.appendChild(h('p', { class: 'w-note-s' }, 'Versión en español con una docena de reglas, inspirada en la idea de 1966; no es el programa original. ¿Sintió por un momento que le entendía? Eso es el «efecto ELIZA».'));

  /* ---------- El tablero de arroz ---------- */
  W.arroz = function (el) {

    var detalle = h('div', { class: 'an-info' });
    var logN = 64;
    var logBox = h('div', { class: 'an-info' });

    }
    function pintar() {
      casillas.forEach(function (b, i) {

      }

        h('div', null, h('dt', null, 'Total acumulado hasta aquí'), h('dd', { class: 'mono', style: { overflowWrap: 'anywhere' } }, M.miles(granos(sel + 1) - 1n)))));
      pintarLog();
    }
    function pintarLog() {
      var e = (logN - 1) * 0.30103;
      var ent = Math.floor(e), mant = Math.pow(10, e - ent);
      M.clear(logBox);
      logBox.appendChild(h('h4', null, 'Llegó la hora del logaritmo'));
      logBox.appendChild(h('p', { class: 'small' }, 'La casilla n tiene 2 multiplicado por sí mismo n − 1 veces. El logaritmo responde cuántas veces hay que multiplicar 10 para llegar a ese número. Como multiplicar por 2 equivale a sumar 0,30103 al logaritmo:'));
      logBox.appendChild(h('div', { class: 'w-out' },
        'log(granos) = (' + logN + ' − 1) × 0,30103 = ' + M.dec(e, 2), h('br'),
        '→ unas ' + (ent + 1) + ' cifras: cerca de ' + M.dec(mant, 1) + ' × 10', h('sup', null, ent), ' granos'));
      logBox.appendChild(h('label', { class: 'w-field', for: 'arroz-log' }, h('span', null, 'Pruebe con otra casilla: ' + logN), rangoLog));
    }
    rangoLog.addEventListener('input', function () { logN = Number(rangoLog.value); pintarLog(); });
    function comprobar() {
      var sig = hechas + 1;
      if (sig > 64) return;
      var limpio = inp.value.replace(/[.\s ]/g, '');
      if (!/^\d+$/.test(limpio)) { fb.textContent = 'Escriba solo cifras; puede usar punto para los miles.'; return; }
      if (BigInt(limpio) === granos(sig)) {
        hechas = sig; sel = sig; inp.value = '';
        fb.textContent = sig === 64 ? '¡Completo! El tablero tiene en total ' + M.miles(granos(65) - 1n) + ' granos.' : 'Correcto. Siga con la casilla ' + (sig + 1) + '.';
        if (sig === 21) fb.textContent += ' Los números ya pasan del millón: pruebe el atajo del logaritmo.';
        pintar(); inp.focus();
      } else {
        fb.textContent = sig === 1 ? 'Pista: en la primera casilla hay un solo grano.' : 'Todavía no. Pista: es el doble de la casilla ' + (sig - 1) + ', que tiene ' + M.miles(granos(sig - 1)) + '.';
      }
    }
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); comprobar(); } });
    el.appendChild(h('div', { class: 'arroz' },
      h('div', { class: 'stack' }, tablero, h('span', { class: 'w-note-s' }, 'Desde la casilla 21 el tablero muestra potencias de 2 para que los números quepan. Toque una casilla para ver su valor exacto.')),
      h('div', { class: 'stack' },
        pregunta,
        h('div', { class: 'btnrow' },
          h('button', { class: 'btn small primary', type: 'button', onclick: comprobar }, 'Comprobar'),
          h('button', { class: 'btn small', type: 'button', onclick: function () { if (hechas < 64) { hechas++; sel = hechas; fb.textContent = 'Casilla ' + hechas + ' rellenada.'; pintar(); } } }, 'Rellenar esta casilla'),
          h('button', { class: 'btn small ghost', type: 'button', onclick: function () { hechas = 64; sel = 64; fb.textContent = 'Tablero completo: ' + M.miles(granos(65) - 1n) + ' granos en total, unos ' + M.enPalabras(granos(65) - 1n) + '.'; pintar(); } }, 'Llenar todo'),
          h('button', { class: 'btn small ghost', type: 'button', onclick: function () { hechas = 0; sel = 1; fb.textContent = ''; pintar(); } }, 'Empezar de nuevo')),
        fb, detalle, logBox,
        h('p', { class: 'w-note-s' }, 'Conexión con la ley de Moore: duplicar cada dos años durante 20 años equivale a avanzar 10 casillas, es decir, multiplicar por 1.024.'))));
    pintar();
  };
})();

    el.appendChild(exp);

<script>
/* Widgets del Taller 4: CPU frente a GPU, autocompletado de juguete, jerarquía

(function () {

  function vivo(el) { return document.body.contains(el); }

    var v = getComputedStyle(document.documentElement).getPropertyValue(nombre).trim();
    return v || '#888';
  }

  /* ---------- Profesor frente a estadio (CPU y GPU) ---------- */
  W.gpu = function (el) {
    var N = 16, TOTAL = N * N;
    function lienzo() { var c = h('canvas', { width: N, height: N, 'aria-hidden': 'true' }); return c; }
    var cCpu = lienzo(), cGpu = lienzo();
    var tCpu = h('span', { class: 'gt' }, 'Pasos: 0'), tGpu = h('span', { class: 'gt' }, 'Pasos: 0');
    var msg = h('p', { class: 'w-note', 'aria-live': 'polite' });
    var corriendo = false;
    function colorPixel(x, y) {
      var cx = x - 7.5, cy = y - 7.5, d = Math.sqrt(cx * cx + cy * cy);
      var cols = [colorVar('--t1'), colorVar('--t2'), colorVar('--t3'), colorVar('--t4')];
      if (d > 7.6) return colorVar('--surface');
      var ang = (Math.atan2(cy, cx) + Math.PI) / (2 * Math.PI);
      if (d < 2.4) return colorVar('--ink');
      return cols[Math.floor(ang * 4) % 4];
    }
    function limpiar(c) { var g = c.getContext('2d'); g.fillStyle = colorVar('--surface-2'); g.fillRect(0, 0, N, N); }
    function pintarPx(c, i) { var g = c.getContext('2d'); var x = i % N, y = Math.floor(i / N); g.fillStyle = colorPixel(x, y); g.fillRect(x, y, 1, 1); }
    function correr() {
      if (corriendo) return; corriendo = true;
      limpiar(cCpu); limpiar(cGpu);
      var paso = 0, cpuHecho = 0, gpuHecho = false;
      msg.textContent = 'Pintando 256 píxeles…';
      var it = setInterval(function () {
        if (!vivo(el)) { clearInterval(it); return; }
        paso++;
        if (!gpuHecho) { for (var i = 0; i < TOTAL; i++) pintarPx(cGpu, i); gpuHecho = true; tGpu.textContent = 'Pasos: 1 · 256 núcleos a la vez'; }
        for (var k = 0; k < 4 && cpuHecho < TOTAL; k++) pintarPx(cCpu, cpuHecho++);
        tCpu.textContent = 'Pasos: ' + paso + ' · 4 núcleos';
        if (cpuHecho >= TOTAL) {
          clearInterval(it); corriendo = false;
          msg.textContent = 'La CPU necesitó 64 pasos; la GPU, uno solo. Entrenar una red neuronal es repetir operaciones sencillas sobre millones de números: justo lo que hace bien la GPU.';
        }
      }, 60);
    }
    limpiar(cCpu); limpiar(cGpu);
    el.appendChild(h('p', { class: 'w-note' }, 'Hay que pintar 256 puntos de una imagen. La CPU tiene 4 núcleos muy versátiles; la GPU, cientos de núcleos sencillos que hacen lo mismo a la vez.'));
    el.appendChild(h('div', { class: 'gpu' },
      h('div', { class: 'gp' }, h('b', null, 'CPU: el profesor'), cCpu, tCpu),

    el.appendChild(h('div', { class: 'btnrow' }, h('button', { class: 'btn small primary', type: 'button', onclick: correr }, M.icon('play'), 'Pintar la imagen')));
    el.appendChild(msg);
    el.appendChild(h('p', { class: 'w-note-s' }, 'Simplificación: cada núcleo de una GPU es más sencillo y lento que uno de CPU; su ventaja está en hacer la misma operación muchas veces a la vez.'));
  };

  /* ---------- Un autocompletado de juguete ---------- */
  var modelo = null;
  function corpus() {
    var textos = [];
    function add(t) { if (typeof t === 'string') textos.push(t); }
    M.talleres.forEach(function (t) {
      add(t.intro);
      t.secciones.forEach(function (sec) {
        ['items', 'eventos', 'capitulos', 'actividades'].forEach(function (k) {
          (sec[k] || []).forEach(function (it) { add(it.d); add(it.h); add(it.p); });
        });
        if (sec.leccion) add(sec.leccion.d);
        (sec.notas || []).forEach(function (n) { add(n.d); });
        (sec.textos || []).forEach(add);
      });
    });
    return textos.join(' ');
  }
  function entrenar() {
    if (modelo) return modelo;
    var txt = corpus().replace(/\([^()]*\)/g, ' ').toLowerCase();
    var palabras = txt.match(/[a-záéíóúüñ]+/g) || [];
    var big = {};
    for (var i = 0; i < palabras.length - 1; i++) {
      var a = palabras[i], b = palabras[i + 1];
      (big[a] || (big[a] = {}))[b] = (big[a][b] || 0) + 1;
    }
    modelo = { big: big, n: palabras.length, voc: Object.keys(big).length };
    return modelo;
  }
  W.autocompletar = function (el) {
    var mod = entrenar();
    var texto = ['la'];
    var caja = h('div', { class: 'auto-txt', 'aria-live': 'polite' });
    var opts = h('div', { class: 'auto-opts' });
    var aviso = h('p', { class: 'w-note-s' });
    function siguientes(w) {
      var d = mod.big[w]; if (!d) return [];
      var tot = 0; Object.keys(d).forEach(function (k) { tot += d[k]; });
      return Object.keys(d).map(function (k) { return { w: k, p: d[k] / tot }; }).sort(function (a, b) { return b.p - a.p; });
    }
    function pintar() {
      M.clear(caja);
      caja.appendChild(document.createTextNode(texto.join(' ')));
      caja.appendChild(h('span', { class: 'cur' }));
      M.clear(opts);
      var sg = siguientes(texto[texto.length - 1]);
      if (!sg.length) { aviso.textContent = 'El modelo nunca vio nada después de «' + texto[texto.length - 1] + '». Borre una palabra o empiece de nuevo.'; return; }
      aviso.textContent = 'Toque una palabra para seguir. Los porcentajes salen de contar qué palabra viene después de «' + texto[texto.length - 1] + '» en el texto del módulo.';
      sg.slice(0, 4).forEach(function (o) {
        opts.appendChild(h('button', { type: 'button', onclick: function () { texto.push(o.w); pintar(); } },
          h('span', { class: 'aw' }, o.w), h('span', { class: 'ap' }, M.dec(o.p * 100, 0) + ' %'), h('span', { class: 'apb' }, h('i', { style: { width: (o.p * 100) + '%' } }))));
      });
    }
    function azar() {
      var sg = siguientes(texto[texto.length - 1]);
      if (!sg.length) return;
      var r = Math.random(), acc = 0;
      for (var i = 0; i < sg.length; i++) { acc += sg[i].p; if (r <= acc) { texto.push(sg[i].w); break; } }
      pintar();
    }
    var inicios = ['la', 'el', 'una', 'en', 'los', 'colombia'];
    el.appendChild(h('p', { class: 'w-note' }, 'Este modelo de juguete aprendió del propio texto del módulo (unas ' + M.miles(mod.n) + ' palabras). Solo mira la palabra anterior y predice cuál suele venir después.'));
    el.appendChild(h('div', { class: 'btnrow' }, h('span', { class: 'w-note-s' }, 'Empezar con:'), inicios.map(function (w) { return h('button', { class: 'chip', type: 'button', onclick: function () { texto = [w]; pintar(); } }, w); })));
    el.appendChild(caja);
    el.appendChild(opts);
    el.appendChild(aviso);
    el.appendChild(h('div', { class: 'btnrow' },
      h('button', { class: 'btn small primary', type: 'button', onclick: azar }, 'Que elija el modelo'),
      h('button', { class: 'btn small', type: 'button', onclick: function () { for (var i = 0; i < 8; i++) azar(); } }, 'Ocho palabras seguidas'),
      h('button', { class: 'btn small ghost', type: 'button', onclick: function () { if (texto.length > 1) texto.pop(); pintar(); } }, 'Borrar la última')));
    el.appendChild(h('p', { class: 'w-note-s' }, 'Fíjese: a veces arma frases que suenan bien pero son falsas. Es una alucinación en miniatura. Los modelos reales miran miles de tokens, no una sola palabra, y tienen miles de millones de parámetros.'));

  };

  W.memoria = function (el) {

      var t = (g.titulo || 'SIN TÍTULO').toUpperCase() + '\n' + 'Una película sobre ' + (g.maquina || 'una máquina') + (g.anio ? ', en ' + g.anio : '') + '.\n\n';
      CAMPOS.slice(3).forEach(function (c) { if (g[c[0]]) t += c[1] + '\n' + g[c[0]] + '\n\n'; });
      (g.escenas || []).forEach(function (e, i) {
        t += 'ESCENA ' + (i + 1) + (e.lugar ? '. ' + e.lugar.toUpperCase() : '') + '\n' + (e.quien ? e.quien + ': ' : '') + (e.pasa || '') + '\n\n';
      });
      return t.trim();
    }
    var banner = h('p', { class: 'banner' }, 'Guion de ejemplo para mostrar la herramienta. Empiece en blanco para escribir el del grupo.');
    var prevTxt = h('div', { class: 'preview-guion', 'aria-live': 'off' });
    function pintar() {
      M.clear(cont);
      banner.hidden = !g.ejemplo;
      var form = h('div', { class: 'guion-form' });
      CAMPOS.forEach(function (c) {
        var id = 'guion-' + c[0], ctl;
        if (c[2] === 'select') {
          ctl = h('select', { class: 'input', id: id }, ['', 'Ideas (algoritmos)', 'Datos', 'Capacidad de cómputo', 'Los tres: ideas, datos y cómputo'].map(function (o) { return h('option', { value: o, selected: g[c[0]] === o }, o || 'Elegir…'); }));
          ctl.addEventListener('change', function () { g[c[0]] = ctl.value; guardar(); });
        } else {
          ctl = h(c[2], { class: 'input', id: id, placeholder: c[3], rows: c[2] === 'textarea' ? 2 : null });
          ctl.value = g[c[0]] || '';
          ctl.addEventListener('input', function () { g[c[0]] = ctl.value; guardar(); });
        }
        form.appendChild(h('label', { class: 'w-field' + (c[4] ? ' full' : ''), for: id }, h('span', null, c[1]), ctl));
      });
      var escenas = h('div', { class: 'escenas' });
      (g.escenas || []).forEach(function (e, i) {
        function campo(k, ph) {
          var x = h(k === 'pasa' ? 'textarea' : 'input', { class: 'input', id: 'esc-' + i + '-' + k, placeholder: ph, 'aria-label': ph, rows: k === 'pasa' ? 2 : null });
          x.value = e[k] || '';
          x.addEventListener('input', function () { e[k] = x.value; guardar(); });
          return x;
        }
        escenas.appendChild(h('div', { class: 'escena' },
          h('div', { class: 'eh' }, h('span', null, 'Escena ' + (i + 1)), h('button', { class: 'btn small ghost', type: 'button', onclick: function () { g.escenas.splice(i, 1); guardar(); pintar(); } }, 'Quitar')),
          h('div', { class: 'guion-form' }, campo('lugar', 'Lugar'), campo('quien', 'Quién habla o actúa'), h('div', { class: 'full' }, campo('pasa', 'Qué pasa')))));
      });
      var confirmar = h('div', { class: 'btnrow', hidden: true }, h('span', { class: 'small' }, '¿Borrar todo el guion?'),
        h('button', { class: 'btn small primary', type: 'button', onclick: function () { g = { ejemplo: false, escenas: [] }; store.set('guion', g); pintar(); } }, 'Sí, borrar'),
        h('button', { class: 'btn small', type: 'button', onclick: function () { confirmar.hidden = true; } }, 'Cancelar'));
      var copiarBtn = h('button', { class: 'btn small primary', type: 'button', onclick: function () { M.copiar(texto(), copiarBtn); } }, M.icon('copiar'), 'Copiar el guion');
      var cartaEl = h('div', { class: 'carta', 'aria-live': 'polite' });
      function pintarCarta() {
        M.clear(cartaEl);
        cartaEl.appendChild(h('span', { class: 'ck' }, 'Carta de inspiración ' + (carta + 1) + ' de ' + CARTAS.length));
        cartaEl.appendChild(h('p', { class: 'ct' }, CARTAS[carta].t));
        cartaEl.appendChild(h('span', { class: 'cs' }, M.rich('Viene del módulo: ' + CARTAS[carta].f)));
      }
      pintarCarta();
      cont.appendChild(h('div', { class: 'guion' },
        h('div', { class: 'stack' }, banner, form,
          h('h4', { class: 'mt-s' }, 'Escenas'), escenas,
          h('div', { class: 'btnrow' },
            h('button', { class: 'btn small', type: 'button', onclick: function () { (g.escenas = g.escenas || []).push({}); guardar(); pintar(); } }, 'Añadir escena'),
            h('button', { class: 'btn small ghost', type: 'button', onclick: function () { confirmar.hidden = false; } }, 'Empezar en blanco'),
            h('button', { class: 'btn small ghost', type: 'button', onclick: function () { g = JSON.parse(JSON.stringify(EJEMPLO_GUION)); store.del('guion'); pintar(); } }, 'Ver el ejemplo')),
          confirmar),
        h('div', { class: 'stack' },
          cartaEl,
          h('div', { class: 'btnrow' }, h('button', { class: 'btn small', type: 'button', onclick: function () { carta = Math.floor(Math.random() * CARTAS.length); pintarCarta(); } }, 'Sacar otra carta'),
            h('span', { class: 'w-note-s' }, 'Cada grupo saca una carta y la mete en su escena.')),
          h('h4', { class: 'mt-s' }, 'Así va el guion'), prevTxt,
          h('div', { class: 'btnrow' }, copiarBtn, h('span', { class: 'w-note-s' }, 'Se guarda solo en este navegador.')))));
      prevTxt.textContent = texto();
    }
    el.appendChild(h('p', { class: 'w-note' }, 'Cada grupo completa una parte o escribe una escena. Usen las preguntas del módulo: ¿quién financia?, ¿quién gana?, ¿quién queda por fuera?, ¿qué ingrediente la hizo posible?'));
    el.appendChild(cont);
    pintar();
  };
})();

</script>
<script>
/* =====================================================================
   app.js — estructura, navegación y segmentos de cada taller
   Rutas por ancla simple: #inicio, #taller1, #taller1-linea, #glosario,
   #referencias, #referencias-ref-12, #juego
   ===================================================================== */
(function () {
  'use strict';
  var M = window.M;
  var h = M.h, p = M.p, rich = M.rich, icon = M.icon, store = M.store;

  M.talleres.sort(function (a, b) { return a.n - b.n; });
  M.indexRefs();

  /* ---------- Preferencias ---------- */
  var prefs = Object.assign({ tema: 'auto', tam: 'm', citas: 'on' }, store.get('prefs', {}));
  function aplicarPrefs() {
    var r = document.documentElement;
    if (prefs.tema === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', prefs.tema);
    if (prefs.tam === 'm') r.removeAttribute('data-size'); else r.setAttribute('data-size', prefs.tam);
    r.setAttribute('data-citas', prefs.citas);
  }
  function guardarPrefs() { store.set('prefs', prefs); aplicarPrefs(); }
  aplicarPrefs();

  /* ---------- Progreso ---------- */
  var visto = store.get('visto', {});
  function marcarVisto(id, val) { if (val) visto[id] = true; else delete visto[id]; store.set('visto', visto); actualizarIndice(); }
  function seccionesDe(t) { return [{ id: 'ficha', nav: 'Ficha', icon: 'ficha' }].concat(t.secciones); }
  function progresoTaller(t) {
    var secs = seccionesDe(t);
    var n = secs.filter(function (s) { return visto[t.slug + '-' + s.id]; }).length;
    return { n: n, total: secs.length };
  }

  /* ---------- Estructura fija ---------- */
  var main, nav, popover, tip;
  function construirMarco() {
    var app = document.getElementById('app');
    var header = h('header', { class: 'topbar' },
      h('div', { class: 'wrap' },
        h('a', { class: 'brand', href: '#inicio', 'aria-label': 'El futuro tiene historia: inicio' },
          h('span', { class: 'brand-mark', 'aria-hidden': 'true' }, h('span'), h('span'), h('span'), h('span')),
          h('span', { class: 'brand-name' }, 'El futuro tiene historia')),
        (nav = h('nav', { class: 'mainnav', 'aria-label': 'Talleres y secciones' })),
        h('button', { class: 'iconbtn', type: 'button', 'aria-label': 'Ajustes de lectura', title: 'Ajustes de lectura', onclick: abrirAjustes }, icon('ajustes'))
      )
    );
    nav.appendChild(h('a', { href: '#inicio', dataset: { page: 'inicio' } }, 'Inicio'));
    M.talleres.forEach(function (t) {
      nav.appendChild(h('a', { href: '#' + t.slug, class: 'era-' + t.n, dataset: { page: t.slug }, title: 'Taller ' + t.n + ': ' + t.titulo },
        h('span', { class: 'n' }, t.n), M.objeto(t.objeto), t.corto));
    });
    nav.appendChild(h('a', { href: '#juego', dataset: { page: 'juego' } }, 'Juego'));
    nav.appendChild(h('a', { href: '#glosario', dataset: { page: 'glosario' } }, 'Glosario'));
    nav.appendChild(h('a', { href: '#referencias', dataset: { page: 'referencias' } }, 'Referencias'));

    main = h('main', { id: 'contenido', tabindex: '-1' });
    var foot = h('footer', { class: 'site-foot' },
      h('div', { class: 'wrap' },
        h('div', { class: 'row' },
          h('strong', null, 'El futuro tiene historia: 90 años entre computadoras e inteligencias artificiales (1936–2026)')),
        h('p', null, M.modulo.verificacion),
        h('div', { class: 'row' },
          h('a', { href: '#glosario' }, 'Glosario básico'),
          h('a', { href: '#referencias' }, 'Referencias (APA 7)'),
          h('a', { href: '#juego' }, 'Juego: ¿en la época de qué objeto?')),
        h('p', { class: 'small' }, 'Tipografías Archivo y Chivo Mono (Omnibus-Type, Argentina) y Alegreya (Huerta Tipográfica, Argentina). Las preferencias y el progreso se guardan solo en este navegador.')
      )
    );
    var fab = h('button', { class: 'fab', type: 'button', onclick: abrirGlosarioRapido, 'aria-label': 'Abrir glosario rápido' }, icon('libro'), 'Glosario');
    popover = h('div', { class: 'popover', role: 'dialog', 'aria-label': 'Referencia', hidden: true });
    tip = h('div', { class: 'tip', role: 'status', hidden: true });
    app.appendChild(h('a', { class: 'skip', href: '#contenido', onclick: function (e) { e.preventDefault(); main.focus(); } }, 'Saltar al contenido'));
    app.appendChild(header);
    app.appendChild(main);
    app.appendChild(foot);
    app.appendChild(fab);
    app.appendChild(popover);
    app.appendChild(tip);
  }

  /* ---------- Citas: ventana emergente ---------- */
  function urlDe(texto) { var m = texto.match(/(https?:\/\/\S+)$/); return m ? m[1] : null; }
  function textoConEnlace(texto) {
    var url = urlDe(texto);
    if (!url) return document.createTextNode(texto);
    var frag = document.createDocumentFragment();
    frag.appendChild(document.createTextNode(texto.slice(0, texto.length - url.length)));
    frag.appendChild(h('a', { href: url, target: '_blank', rel: 'noopener' }, url));
    return frag;
  }
  function refPorId(id) { return (M.referencias || []).filter(function (r) { return r.id === id; })[0]; }
  function mostrarCita(btn) {
    var ref = refPorId(btn.getAttribute('data-ref'));
    if (!ref) return;
    M.clear(popover);
    var url = urlDe(ref.t);
    popover.appendChild(h('div', { class: 'pk' }, 'Referencia · ' + ref.k));
    popover.appendChild(h('div', { class: 'ptxt' }, textoConEnlace(ref.t)));
    popover.appendChild(h('div', { class: 'btnrow' },
      url ? h('a', { class: 'btn small', href: url, target: '_blank', rel: 'noopener' }, icon('externo'), 'Abrir fuente') : null,
      h('a', { class: 'btn small ghost', href: '#referencias-' + ref.id, onclick: cerrarCita }, 'Ver en la lista'),
      h('button', { class: 'btn small ghost', type: 'button', onclick: cerrarCita }, 'Cerrar')));
    popover.hidden = false;
    var r = btn.getBoundingClientRect();
    var pw = popover.offsetWidth, ph = popover.offsetHeight;
    var x = Math.min(Math.max(12, r.left), window.innerWidth - pw - 12);
    var y = r.bottom + 8;
    if (y + ph > window.innerHeight - 12) y = Math.max(12, r.top - ph - 8);
    popover.style.left = x + 'px';
    popover.style.top = y + 'px';
    popover._from = btn;
    var first = popover.querySelector('a,button');
    if (first) first.focus({ preventScroll: true });
  }
  function cerrarCita() {
    if (popover.hidden) return;
    popover.hidden = true;
    if (popover._from && document.contains(popover._from)) popover._from.focus({ preventScroll: true });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.cita button[data-ref]');
    if (b) { e.preventDefault(); mostrarCita(b); return; }
    if (!popover.hidden && !popover.contains(e.target)) cerrarCita();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { cerrarCita(); cerrarHoja(); }
  });
  window.addEventListener('scroll', function () { if (!popover.hidden) cerrarCita(); M.tipHide(); }, { passive: true });

  /* Tooltip compartido para gráficos */
  M.tipShow = function (html, x, y) {
    tip.innerHTML = html;
    tip.hidden = false;
    var w = tip.offsetWidth, hh = tip.offsetHeight;
    tip.style.left = Math.min(Math.max(8, x - w / 2), window.innerWidth - w - 8) + 'px';
    tip.style.top = Math.max(8, y - hh - 12) + 'px';
  };
  M.tipHide = function () { if (tip) tip.hidden = true; };

  /* ---------- Hojas laterales: ajustes y glosario rápido ---------- */
  var hoja = null;
  function cerrarHoja() {
    if (!hoja) return;
    hoja.back.remove(); hoja.el.remove();
    if (hoja.from) hoja.from.focus({ preventScroll: true });
    hoja = null;
  }
  function abrirHoja(titulo, cuerpo) {
    cerrarHoja();
    var back = h('div', { class: 'sheet-back', onclick: cerrarHoja });
    var el = h('aside', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': titulo },
      h('div', { class: 'sheet-h' }, h('h2', null, titulo),
        h('button', { class: 'iconbtn', type: 'button', 'aria-label': 'Cerrar', onclick: cerrarHoja }, icon('cerrar'))),
      h('div', { class: 'sheet-b' }, cuerpo));
    hoja = { back: back, el: el, from: document.activeElement };
    document.body.appendChild(back);
    document.body.appendChild(el);
    var f = el.querySelector('input, button:not(.iconbtn)') || el.querySelector('button');
    if (f) f.focus();
  }
  function segCtl(opciones, valor, onChange) {
    var wrap = h('div', { class: 'seg-ctl', role: 'group' });
    opciones.forEach(function (o) {
      wrap.appendChild(h('button', { type: 'button', 'aria-pressed': String(o[0] === valor), onclick: function () {
        Array.prototype.forEach.call(wrap.children, function (b) { b.setAttribute('aria-pressed', 'false'); });
        this.setAttribute('aria-pressed', 'true');
        onChange(o[0]);
      } }, o[1]));
    });
    return wrap;
  }
  function abrirAjustes() {
    var confirmar = h('div', { class: 'btnrow', hidden: true },
      h('span', { class: 'small' }, '¿Borrar progreso, objetivos, puntajes y notas de las actividades?'),
      h('button', { class: 'btn small primary', type: 'button', onclick: function () {
        store.keys().forEach(function (k) { if (k.indexOf('prefs') === -1) { try { localStorage.removeItem(k); } catch (e) { /* nada */ } } });
        visto = {};
        cerrarHoja();
        render(true);
      } }, 'Sí, borrar'),
      h('button', { class: 'btn small', type: 'button', onclick: function () { confirmar.hidden = true; } }, 'Cancelar'));
    abrirHoja('Ajustes de lectura', [
      h('div', { class: 'opt-group' }, h('span', null, 'Tema'),
        segCtl([['auto', 'Automático'], ['light', 'Claro'], ['dark', 'Oscuro']], prefs.tema, function (v) { prefs.tema = v; guardarPrefs(); })),
      h('div', { class: 'opt-group' }, h('span', null, 'Tamaño de letra'),
        segCtl([['m', 'Normal'], ['l', 'Grande'], ['xl', 'Muy grande']], prefs.tam, function (v) { prefs.tam = v; guardarPrefs(); })),
      h('div', { class: 'opt-group' }, h('span', null, 'Citas en el texto'),
        segCtl([['on', 'Mostrar'], ['off', 'Ocultar']], prefs.citas, function (v) { prefs.citas = v; guardarPrefs(); }),
        h('p', { class: 'w-note-s' }, 'Ocultarlas aligera la lectura en voz alta o en pantalla grande. Las referencias siguen en su página.')),
      h('div', { class: 'opt-group' }, h('span', null, 'Progreso'),
        h('p', { class: 'small muted' }, 'Los segmentos vistos, los objetivos y los puntajes se guardan solo en este navegador.'),
        h('button', { class: 'btn small', type: 'button', onclick: function () { confirmar.hidden = false; } }, icon('reset'), 'Reiniciar progreso'),
        confirmar)
    ]);
  }
  function abrirGlosarioRapido() {
    var lista = h('div');
    var input = h('input', { class: 'input', type: 'search', id: 'gq-buscar', placeholder: 'Buscar un término…', 'aria-label': 'Buscar en el glosario' });
    function pintar() {
      var q = norm(input.value);
      M.clear(lista);
      M.glosario.filter(function (g) { return !q || norm(g.t + ' ' + g.d).indexOf(q) !== -1; }).forEach(function (g) {
        lista.appendChild(h('div', { class: 'gq-item' }, h('h3', null, g.t), h('p', null, g.d)));
      });
      if (!lista.children.length) lista.appendChild(h('p', { class: 'small muted' }, 'Ningún término coincide. Pruebe con otra palabra.'));
    }
    input.addEventListener('input', pintar);
    pintar();
    abrirHoja('Glosario rápido', [input, lista, h('a', { class: 'btn small', href: '#glosario', onclick: cerrarHoja }, 'Abrir el glosario completo')]);
  }
  function norm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  M.norm = norm;

  /* ---------- Piezas reutilizables ---------- */
  function chipHilo(c) {
    var hl = M.HILOS[c];
    return h('span', { class: 'chip', title: hl.d }, icon(hl.icon), hl.n);
  }
  function barras(datos) {
    var max = datos.max || Math.max.apply(null, datos.filas.map(function (f) { return f[1]; }));
    var wrap = h('div', { class: 'barras' });
    datos.filas.forEach(function (f) {
      var dec = String(f[1]).split('.')[1];
      var val = dec ? M.dec(f[1], dec.length) : M.miles(f[1]);
      wrap.appendChild(h('div', { class: 'barra' + (f[2] ? ' ref' : '') },
        h('div', { class: 'bl' }, h('span', null, f[0]), h('b', null, val + ' ' + datos.u)),
        h('div', { class: 'bt', 'aria-hidden': 'true' }, h('i', { style: { width: Math.min(100, f[1] / max * 100) + '%' } }))));
    });
    if (datos.nota) wrap.appendChild(h('div', { class: 'bnote' }, datos.nota));
    return wrap;
  }
  M.barras = barras;
  function montar(nombre, ctx) {
    var c = h('div', { class: 'w' });
    var fn = M.widgets[nombre];
    if (fn) {
      try { fn(c, ctx || {}); }
      catch (e) { c.appendChild(h('p', { class: 'w-note' }, 'No se pudo cargar esta actividad.')); if (window.console) console.error(nombre, e); }
    }
    return c;
  }
  M.montar = montar;

  function panelLab(labs, ctx, idBase) {
    var tabs = h('div', { class: 'lab-tabs', role: 'tablist', 'aria-label': 'Actividades del laboratorio' });
    var body = h('div', { class: 'lab-body' });
    var el = h('div', { class: 'lab', id: idBase + '-lab' },
      h('div', { class: 'lab-head' }, h('div', { class: 'lab-title' }, icon('lab'), 'Laboratorio'), tabs), body);
    var paneles = {}, botones = {};
    function select(id, scroll) {
      Object.keys(botones).forEach(function (k) {
        botones[k].setAttribute('aria-selected', String(k === id));
        botones[k].tabIndex = k === id ? 0 : -1;
        if (paneles[k]) paneles[k].hidden = k !== id;
      });
      if (!paneles[id]) {
        paneles[id] = h('div', { role: 'tabpanel', id: idBase + '-lab-' + id, 'aria-label': (labs.filter(function (l) { return l.id === id; })[0] || {}).n });
        paneles[id].appendChild(montar(id, ctx));
        body.appendChild(paneles[id]);
      }
      if (scroll) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    labs.forEach(function (l) {
      botones[l.id] = h('button', { type: 'button', role: 'tab', 'aria-controls': idBase + '-lab-' + l.id, onclick: function () { select(l.id); } }, l.n);
      tabs.appendChild(botones[l.id]);
    });
    tabs.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      var ids = labs.map(function (l) { return l.id; });
      var cur = ids.indexOf(Object.keys(botones).filter(function (k) { return botones[k].getAttribute('aria-selected') === 'true'; })[0]);
      var nx = (cur + (e.key === 'ArrowRight' ? 1 : -1) + ids.length) % ids.length;
      select(ids[nx]); botones[ids[nx]].focus();
    });
    select(labs[0].id);
    el.select = select;
    return el;
  }

  function temporizador(min) {
    var opciones = [10, 15, 20, 30, 45];
    var total = (min || 20) * 60, resto = total, timer = null;
    var tt = h('div', { class: 'tt', 'aria-live': 'off' });
    var el = h('div', { class: 'timer' });
    function pintar() { tt.textContent = String(Math.floor(resto / 60)).padStart(2, '0') + ':' + String(resto % 60).padStart(2, '0'); }
    var btnPlay = h('button', { class: 'btn small primary', type: 'button', onclick: function () {
      if (timer) { clearInterval(timer); timer = null; btnPlay.textContent = 'Seguir'; return; }
      if (resto <= 0) { resto = total; el.classList.remove('done'); }
      btnPlay.textContent = 'Pausar';
      timer = setInterval(function () {
        resto--; pintar();
        if (resto <= 0) { clearInterval(timer); timer = null; el.classList.add('done'); btnPlay.textContent = 'Iniciar'; M.beep(660, 0.3); setTimeout(function () { M.beep(880, 0.5); }, 350); }
      }, 1000);
    } }, 'Iniciar');
    var btnReset = h('button', { class: 'btn small', type: 'button', onclick: function () { clearInterval(timer); timer = null; resto = total; el.classList.remove('done'); btnPlay.textContent = 'Iniciar'; pintar(); } }, 'Reiniciar');
    el.appendChild(h('span', { class: 'eyebrow' }, min ? 'Tiempo sugerido' : 'Temporizador'));
    el.appendChild(tt);
    if (!min) {
      var sel = h('select', { class: 'input', 'aria-label': 'Minutos', id: 'tmin-' + Math.random().toString(36).slice(2, 7), onchange: function () { total = Number(sel.value) * 60; resto = total; pintar(); } },
        opciones.map(function (o) { return h('option', { value: o, selected: o === 20 }, o + ' min'); }));
      el.appendChild(sel);

      var el = h('article', { class: 'term' }, h('h3', null, g.t), h('p', null, g.d),
        h('div', { class: 'tt' }, g.talleres.map(function (n) { return h('a', { class: 'era-' + n, href: '#taller' + n, title: M.talleres[n - 1].titulo }, 'Taller ' + n); })));
      grid.appendChild(el);
      return { el: el, g: g };
    });
    var cuenta = h('span', { class: 'w-note-s', 'aria-live': 'polite' });
    function filtrar() {
      var n = 0;
      items.forEach(function (it) {
        var ok = (!q || M.norm(it.g.t + ' ' + it.g.d).indexOf(q) !== -1) && (!taller || it.g.talleres.indexOf(taller) !== -1);
        it.el.hidden = !ok; if (ok) n++;
      });
      cuenta.textContent = n + ' términos';
      botones.forEach(function (b) { b.setAttribute('aria-pressed', String(Number(b.dataset.n) === taller)); });
    }
    var input = h('input', { class: 'input', type: 'search', id: 'glosario-buscar', placeholder: 'Buscar un término o una palabra…', 'aria-label': 'Buscar en el glosario', oninput: function () { q = M.norm(input.value); filtrar(); } });
    var botones = [0, 1, 2, 3, 4].map(function (n) {
      return h('button', { class: 'chip', type: 'button', dataset: { n: n }, onclick: function () { taller = n; filtrar(); } }, n ? 'Taller ' + n : 'Todos');
    });
    main.appendChild(h('div', { class: 'wrap' },
      h('header', { class: 'page-head' }, h('span', { class: 'eyebrow' }, 'Glosario básico'), h('h1', null, 'Palabras para no perderse'),
        h('p', null, 'Definiciones breves de los términos técnicos del módulo, con los talleres en que aparecen.')),
      h('div', { class: 'toolbar' }, input, botones, cuenta),
      grid));
    filtrar();
  };
  M.paginas.referencias = function () {
    main.className = 'era-0';
    var ol = h('ol', { class: 'refs' });
    var items = M.referencias.map(function (r) {
      var li = h('li', { id: r.id }, textoConEnlace(r.t));
      ol.appendChild(li);
      return { li: li, r: r };
    });
    var cuenta = h('span', { class: 'w-note-s', 'aria-live': 'polite' });
    var input = h('input', { class: 'input', type: 'search', id: 'refs-buscar', placeholder: 'Buscar autor, año o tema…', 'aria-label': 'Buscar en las referencias', oninput: function () {
      var q = M.norm(input.value), n = 0;
      items.forEach(function (it) { var ok = !q || M.norm(it.r.t).indexOf(q) !== -1; it.li.hidden = !ok; if (ok) n++; });
      cuenta.textContent = n + ' referencias';
    } });
    cuenta.textContent = items.length + ' referencias';
    main.appendChild(h('div', { class: 'wrap' },
      h('header', { class: 'page-head' }, h('span', { class: 'eyebrow' }, 'Referencias · APA 7'), h('h1', null, 'De dónde sale cada dato'),
        h('p', null, 'Cada cita del texto remite a esta lista. Toque una cita en cualquier taller para ver su referencia sin salir de la página.')),
      h('div', { class: 'verif' }, h('strong', null, 'Nota de verificación. '), M.modulo.verificacion),
      h('div', { class: 'toolbar' }, input, cuenta),
      ol));
  };

  function tallerActual() {
    var r = ruta();
    return M.talleres.filter(function (t) { return t.slug === r.page; })[0] || null;
  }
  function ruta() {
    var raw = decodeURIComponent((location.hash || '').slice(1)) || 'inicio';
    var i = raw.indexOf('-');
    return { raw: raw, page: i === -1 ? raw : raw.slice(0, i), sec: i === -1 ? null : raw.slice(i + 1) };
  }
  var paginaActual = null;
  function render(forzar, destino) {
    var r = ruta();
    var esTaller = M.talleres.some(function (t) { return t.slug === r.page; });
    if (!esTaller && !M.paginas[r.page]) { r = { raw: 'inicio', page: 'inicio', sec: null }; }
    var cambia = forzar || paginaActual !== r.page;
    if (cambia) {
      if (observador) observador.disconnect();
      M.tipHide(); cerrarCita();
      M.clear(main);
      paginaActual = r.page;
      if (esTaller) paginaTaller(tallerActual());
      else M.paginas[r.page]();
      Array.prototype.forEach.call(nav.querySelectorAll('a'), function (a) {
        if (a.dataset.page === r.page) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
      });
      var actual = nav.querySelector('[aria-current="page"]');
      if (actual && nav.scrollWidth > nav.clientWidth) nav.scrollTo({ left: actual.offsetLeft - 40 });
      var t = tallerActual();
      document.title = t ? 'Taller ' + t.n + ': ' + t.titulo + ' · El futuro tiene historia' : (r.page === 'inicio' ? 'El futuro tiene historia' : (nav.querySelector('[aria-current="page"]') || {}).textContent + ' · El futuro tiene historia');
    }
    var objetivo = destino || (r.sec ? r.raw : null);
    if (objetivo) {
      var el = document.getElementById(objetivo) || (r.sec && document.getElementById(r.sec));
      if (el) {
        requestAnimationFrame(function () {
          el.scrollIntoView({ behavior: cambia ? 'instant' : 'smooth', block: 'start' });
          if (el.tagName === 'LI') { el.classList.add('flash'); setTimeout(function () { el.classList.remove('flash'); }, 2400); }
        });
      }
    } else if (cambia) {
      window.scrollTo(0, 0);
    }
  }
  M.render = render;
  window.addEventListener('hashchange', function () { render(false); });

  construirMarco();
  render(true);
})();

</script>
</body>
</html>
